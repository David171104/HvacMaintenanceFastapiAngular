<label class="ds-field">
  <span class="ds-label" *ngIf="label">{{ label }}</span>
  <input
    class="ds-control"
    [class.ds-control--invalid]="!!error"
    [id]="inputId || null"
    [type]="type"
    [value]="value"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete || null"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  <small class="ds-hint" *ngIf="hint && !error">{{ hint }}</small>
  <small class="ds-error" *ngIf="error">{{ error }}</small>
</label>
