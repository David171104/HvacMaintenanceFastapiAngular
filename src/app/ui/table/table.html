<div class="ds-table-shell">
  <table class="ds-table" *ngIf="rows.length > 0; else emptyState">
    <thead>
      <tr>
        <th *ngFor="let column of columns">{{ column.label }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td *ngFor="let column of columns">{{ row[column.key] ?? '-' }}</td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #emptyState>
  <div class="ds-table-shell ui-table__empty">{{ emptyMessage }}</div>
</ng-template>
