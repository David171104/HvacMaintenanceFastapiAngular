<aside class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="mobileOpen">
  <div class="sidebar__top">
    <a class="sidebar__brand" [routerLink]="brandRoute" (click)="handleNavigate()">
      <span class="sidebar__brand-mark">CT</span>
      <div class="sidebar__brand-copy" *ngIf="!isCollapsed">
        <strong>{{ brandLabel }}</strong>
        <span>{{ brandSubLabel }}</span>
      </div>
    </a>

    <div class="sidebar__controls">
      <button type="button" class="sidebar__icon-btn sidebar__desktop-toggle" (click)="toggleSidebar()">
        {{ isCollapsed ? '>>' : '<<' }}
      </button>
      <button type="button" class="sidebar__icon-btn sidebar__mobile-close" (click)="closeRequested.emit()">
        ✕
      </button>
    </div>
  </div>

  <div class="sidebar__section" *ngIf="!isCollapsed">
    <p class="sidebar__eyebrow">Navegación</p>
  </div>

  <nav class="sidebar__nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="is-active"
      class="sidebar__nav-item"
      (click)="handleNavigate()"
    >
      <span class="sidebar__nav-icon">{{ item.icon }}</span>
      <span class="sidebar__nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__footer-note" *ngIf="!isCollapsed">
      <small>Sesión activa</small>
      <strong>{{ environmentLabel }}</strong>
    </div>

    <!-- Tarjeta de perfil: contenedor pasivo sin evento de clic global -->
    <div class="sidebar__profile">
      <!-- Lado izquierdo: Avatar + info (solo lectura, sin interacción) -->
      <span class="sidebar__avatar" aria-hidden="true">{{ getUserInitials() }}</span>
      <span class="sidebar__profile-copy" *ngIf="!isCollapsed">
        <strong>{{ userName }} {{ userLastName }}</strong>
        <small>{{ userRole | titlecase }}</small>
      </span>

      <!-- Botón de cerrar sesión aislado (área de clic pequeña y precisa) -->
      <button
        *ngIf="!isCollapsed"
        type="button"
        class="sidebar__logout-btn"
        (click)="confirmarLogout()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <!-- Icono SVG de salida (door/arrow-right-from-bracket) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="sidebar__logout-label">Salir</span>
      </button>

      <!-- En modo colapsado: solo el ícono de logout sin texto -->
      <button
        *ngIf="isCollapsed"
        type="button"
        class="sidebar__logout-btn sidebar__logout-btn--icon-only"
        (click)="confirmarLogout()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </div>
</aside>
