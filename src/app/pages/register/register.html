<section class="register-page">
  <div class="register-page__backdrop"></div>

  <ui-card class="register-card" [glass]="true">
    <div class="register-card__header">
      <p class="register-card__eyebrow">Nuevo acceso</p>
      <h1>Crear cuenta</h1>
      <p class="register-card__subtitle">Registra tu acceso al sistema IoT industrial.</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="register-form__grid register-form__grid--two">
        <ui-input
          label="Nombres"
          type="text"
          inputId="register-name"
          formControlName="name"
          autocomplete="given-name"
          placeholder="Ej. Laura"
          [error]="isInvalid('name') ? (getError('name', 'Nombres') || '') : ''"
        />

        <ui-input
          label="Apellidos"
          type="text"
          inputId="register-last-name"
          formControlName="last_name"
          autocomplete="family-name"
          placeholder="Ej. Torres"
          [error]="isInvalid('last_name') ? (getError('last_name', 'Apellidos') || '') : ''"
        />
      </div>

      <div class="register-form__grid register-form__grid--two">
        <ui-input
          label="Número de documento"
          type="text"
          inputId="register-document"
          formControlName="document_number"
          autocomplete="off"
          placeholder="123456789"
          [error]="isInvalid('document_number') ? (getError('document_number', 'Documento') || '') : ''"
        />

        <ui-input
          label="Edad"
          type="number"
          inputId="register-age"
          formControlName="age"
          autocomplete="off"
          placeholder="28"
          [error]="isInvalid('age') ? (getError('age', 'Edad') || '') : ''"
        />
      </div>

      <ui-input
        label="Correo electrónico"
        type="email"
        inputId="register-email"
        formControlName="email"
        autocomplete="email"
        placeholder="operador@climatech.io"
        [error]="isInvalid('email') ? (getError('email', 'Correo electrónico') || '') : ''"
      />

      <div class="register-form__grid register-form__grid--two">
        <ui-input
          label="Contraseña"
          type="password"
          inputId="register-password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Crea una contraseña segura"
          [error]="isInvalid('password') ? (getError('password', 'Contraseña') || '') : ''"
        />

        <ui-input
          label="Confirmación de contraseña"
          type="password"
          inputId="register-password-confirm"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Repite tu contraseña"
          [error]="isInvalid('confirmPassword') ? (getError('confirmPassword', 'Confirmación') || '') : ''"
        />
      </div>

      <small class="register-error" *ngIf="serverError">{{ serverError }}</small>

      <ui-button
        type="submit"
        variant="primary"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="registerForm.invalid || isSubmitting"
      >
        {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
      </ui-button>
    </form>

    <p class="register-card__footer">
      ¿Ya tienes cuenta?
      <button type="button" class="register-link register-link--button" (click)="goToLogin()">
        Iniciar sesión
      </button>
    </p>
  </ui-card>
</section>
