<section class="register-page">
  <div class="register-page__backdrop"></div>

  <ui-card class="register-card" [glass]="true">
    <div class="register-card__header">
      <p class="register-card__eyebrow">Nuevo acceso</p>
      <h1>Crear cuenta</h1>
      <p class="register-card__subtitle">Registra tu acceso al sistema IoT industrial.</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="register-form__grid register-form__grid--two">
        <ui-input
          label="Nombres"
          type="text"
          inputId="register-name"
          formControlName="name"
          autocomplete="given-name"
          placeholder="Ej. Laura"
          [error]="isInvalid('name') ? (getError('name', 'Nombres') || '') : ''"
        />

        <ui-input
          label="Apellidos"
          type="text"
          inputId="register-last-name"
          formControlName="last_name"
          autocomplete="family-name"
          placeholder="Ej. Torres"
          [error]="isInvalid('last_name') ? (getError('last_name', 'Apellidos') || '') : ''"
        />
      </div>

      <div class="register-form__grid register-form__grid--two">
        <ui-input
          label="Número de documento"
          type="text"
          inputId="register-document"
          formControlName="document_number"
          autocomplete="off"
          placeholder="123456789"
          [error]="isInvalid('document_number') ? (getError('document_number', 'Documento') || '') : ''"
        />

        <ui-input
          label="Edad"
          type="number"
          inputId="register-age"
          formControlName="age"
          autocomplete="off"
          placeholder="28"
          [error]="isInvalid('age') ? (getError('age', 'Edad') || '') : ''"
        />
      </div>

      <ui-input
        label="Correo electrónico"
        type="email"
        inputId="register-email"
        formControlName="email"
        autocomplete="email"
        placeholder="operador@climatech.io"
        [error]="isInvalid('email') ? (getError('email', 'Correo electrónico') || '') : ''"
      />

      <div class="register-form__grid register-form__grid--two">
        <div class="cs-password-wrapper">
          <ui-input
            label="Contraseña"
            [type]="showPassword ? 'text' : 'password'"
            inputId="register-password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Crea una contraseña segura"
            [error]="isInvalid('password') ? (getError('password', 'Contraseña') || '') : ''"
            style="width: 100%;"
          ></ui-input>
          <button type="button" class="cs-password-toggle" (click)="togglePassword()">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>

        <div class="cs-password-wrapper">
          <ui-input
            label="Confirmación de contraseña"
            [type]="showConfirmPassword ? 'text' : 'password'"
            inputId="register-password-confirm"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Repite tu contraseña"
            [error]="isInvalid('confirmPassword') ? (getError('confirmPassword', 'Confirmación') || '') : ''"
            style="width: 100%;"
          ></ui-input>
          <button type="button" class="cs-password-toggle" (click)="toggleConfirmPassword()">
            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
      </div>

      <small class="register-error" *ngIf="serverError">{{ serverError }}</small>

      <ui-button
        type="submit"
        variant="primary"
        [block]="true"
        [loading]="isSubmitting"
        [disabled]="registerForm.invalid || isSubmitting"
      >
        {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
      </ui-button>
    </form>

    <p class="register-card__footer">
      ¿Ya tienes cuenta?
      <button type="button" class="register-link register-link--button" (click)="goToLogin()">
        Iniciar sesión
      </button>
    </p>
  </ui-card>
</section>
